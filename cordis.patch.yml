# 指挥员核心（dsh-commander）的伴生 patch。
#
# 与 dsh-commander 同构：由 bundles 引入，insert 一条插件条目。
# 两者默认工具名相同，**不要同时启用**（否则工具名冲突）。
- insert:
    - id: commander
      name: '@local/dsh-commander'
      config:
        provider: fork
        commanderName: commander
        docDir: doc
        enforceApproval: true

